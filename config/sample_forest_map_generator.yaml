# Shared launch configuration for forest_map_generator.
# Keep this file as config/forest_map_generator.yaml or pass it explicitly with:
#   ros2 launch forest_map_generator tree_generator.launch.py config_file:=/path/to/forest_map_generator.yaml
#   ros2 launch forest_map_generator gazebo.launch.py config_file:=/path/to/forest_map_generator.yaml

common:
  world_name: world_with_trees.world

gazebo:
  run: true
  verbose: 4
  world_dir: worlds
  model_dir: models

tree_generator:
  heightmap_file: orchard_heightmap.png
  num_trees: 200
  tree_types:
    - tree1
    - tree2
    - tree3
    - tree4
    - tree5
    - tree6
    - tree7
    - tree8
    - tree9
    - tree10
    - tree11
    - tree12
    - tree13
    - tree14

  # terrain_size_x/y are heightmap image dimensions in pixels.
  # terrain_world_size_x/y are terrain dimensions in meters.
  terrain_size_x: 257
  terrain_size_y: 257
  terrain_world_size_x: 257.0
  terrain_world_size_y: 257.0
  terrain_size_z: 12.688472747802734

  # If tree models float above the terrain, try -0.2.
  # If they sink below it, try 0.2.
  tree_z_offset: 0.0

  min_tree_distance: 5.0
  max_slope: 30.0

  # If omitted, launch injects common.world_name into this parameter.
  # output_world_file: world_with_trees.world

  placement_mode: random  # orchard_grid, csv_points, or geojson
  placement_file: ""
  geojson_coordinate_mode: local_xy
  enable_road_generation: false

  orchard_origin_x: -40.0
  orchard_origin_y: -30.0
  orchard_rows: 12
  orchard_cols: 20
  orchard_tree_spacing: 4.0
  orchard_row_spacing: 5.0
  orchard_yaw_deg: 10.0
  orchard_jitter_xy: 0.3

  random_seed: 0
  scale_min: 0.9
  scale_max: 1.1
